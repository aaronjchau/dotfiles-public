# ~/.tmux.conf
# ──────────────────────────────────────────────
# General
# ──────────────────────────────────────────────
set -g mouse on                 # trackpad scroll + click to select
set -g status-position top      # status bar on top (nvim's bufferline is off, so the top is free)
set -g set-clipboard on         # OSC52: copy-mode yanks land in the macOS clipboard (works over SSH too)
set -g history-limit 100000     # deep scrollback for long build/log output (tmux default is 2000)

# Vim-style copy mode (v to select, y to yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Remap prefix to Ctrl-a
unbind C-b              # free up the old prefix
set -g prefix C-a       # set new prefix
bind C-a last-window    # prefix + Ctrl-a → last window

# ── Window switching ──
bind H previous-window  # prefix + H / L = prev / next window
bind L next-window
bind N previous-window  # extra prev-window alias
bind Tab last-window    # also flips to the last window
bind R command-prompt -I "#W" "rename-window -- '%%'"   # prefix R = rename window (, is resize); prefix $ renames the session

# ── Pane navigation ──
# Ctrl-h/j/k/l moves across nvim splits + tmux panes (vim-tmux-navigator).
# That steals Ctrl-l from clear-screen, so reclaim it on prefix + Ctrl-l:
bind C-l send-keys 'C-l'

# ── Pane resize (repeatable): , . - = ──
bind -r , resize-pane -L 5
bind -r . resize-pane -R 5
bind -r - resize-pane -D 5
bind -r = resize-pane -U 5

# ── Splits — open in current dir ──
# v = side-by-side · h = stacked · | = side-by-side alias.
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"   # vertical → side by side
bind h split-window -v -c "#{pane_current_path}"   # horizontal → stacked
bind | split-window -h -c "#{pane_current_path}"   # alias for vertical (side-by-side)

# ── Flip pane layout: side-by-side <-> stacked  (prefix + e) ──
# NOTE: ##{pane_top} — if-shell expands formats first, so # must be escaped as ##
# (else #{pane_top} resolves to the current pane's value → one-way).
bind e if-shell 'test "$(tmux list-panes -F "##{pane_top}" | sort -u | wc -l)" -eq 1' 'select-layout even-vertical' 'select-layout even-horizontal'

# ── Window / pane lifecycle ──
# NOTE: prefix+c KILLS the focused pane (no confirm). New window moved to prefix+Ctrl-c.
bind c kill-pane
bind C-c new-window -c "#{pane_current_path}"   # new window in the current dir
bind x swap-pane -D

# ── Quick config reload ──
unbind r
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# fix weird coloring issue with yazi 
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features ",*:RGB"

# fix yazi "Terminal response timeout" + enable image-preview passthrough
# (lets tmux forward Yazi's terminal-capability queries to the outer terminal)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ──────────────────────────────────────────────
# Plugins  (tpm listed first, init kept at the very bottom)
# ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane baseline defaults
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl-h/j/k/l across nvim splits + tmux panes
set -g @plugin 'omerxx/tmux-floax'            # floating terminal  (prefix + p)
set -g @plugin 'tmux-plugins/tmux-resurrect'  # manual save/restore of sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save + auto-restore
set -g @plugin 'fcsonline/tmux-thumbs'        # hint-jump to copy on-screen text (prefix + space)
set -g @plugin 'wfxr/tmux-fzf-url'            # prefix + u → fzf list of on-screen URLs → open

# ──────────────────────────────────────────────
# floax — floating scratch terminal
# ──────────────────────────────────────────────
set -g @floax-bind 'p'                  # prefix + p
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#7E9CD8'    # matches the status bar
set -g @floax-text-color '#DCD7BA'      # foreground

# ──────────────────────────────────────────────
# tmux-thumbs — hint-jump to copy on-screen text  (prefix + space)
# ──────────────────────────────────────────────
set -g @thumbs-key space                       # prefix + space launches it
set -g @thumbs-command 'echo -n {} | pbcopy'   # lowercase hint → copy to macOS clipboard
# (uppercase hint pastes — the plugin default)
set -g @thumbs-hint-fg-color '#1F1F28'
set -g @thumbs-hint-bg-color '#E6C384'
set -g @thumbs-select-fg-color '#DCD7BA'
set -g @thumbs-select-bg-color '#2D4F67'

# ──────────────────────────────────────────────
# tmux-fzf-url — fzf list of every URL on screen, open in browser  (prefix + u)
# ──────────────────────────────────────────────
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-p 60%,40% --no-preview --multi'

# ──────────────────────────────────────────────
# Persistence (continuum depends on resurrect)
# ──────────────────────────────────────────────
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'          # restore layout on tmux start
# Note: restores pane layout + working dirs, NOT live process state.

# ──────────────────────────────────────────────
# Kanagawa "bubble" status bar: rounded pills
# Each segment = rounded caps (U+E0B6/U+E0B4) around text on a pill bg; bar bg=default so pills float. Needs a Nerd Font.
# ──────────────────────────────────────────────
set -g status-style "bg=default,fg=#DCD7BA"
set -g status-left-length 100
set -g status-right-length 100

# Left: session name in a purple bubble
set -g status-left "#[fg=#957FB8,bg=default]#[fg=#16161D,bg=#957FB8,bold] #S #[fg=#957FB8,bg=default] "

# Window list: rounded bubbles — current = blue, others = muted gray. Separator = the gap between pills.
set -g window-status-separator " "
set -g window-status-format "#[fg=#2A2A37,bg=default]#[fg=#C8C093,bg=#2A2A37] #I #W #[fg=#2A2A37,bg=default]"
set -g window-status-current-format "#[fg=#7E9CD8,bg=default]#[fg=#16161D,bg=#7E9CD8,bold] #I #W#{?window_zoomed_flag, 🔍,} #[fg=#7E9CD8,bg=default]"

# Right: current dir (muted bubble) + clock (green bubble). Clock: 12-hour, single-letter A/P.
set -g status-right "#[fg=#2A2A37,bg=default]#[fg=#C8C093,bg=#2A2A37] #{b:pane_current_path} #[fg=#2A2A37,bg=default] #[fg=#98BB6C,bg=default]#[fg=#16161D,bg=#98BB6C,bold] %-I:%M#(date +%p | cut -c1) #[fg=#98BB6C,bg=default] "

# numbering starts from 1 and reorders automatically
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on    # close a window, the rest renumber to stay sequential

# ──────────────────────────────────────────────
# Window picker via television  (prefix + w) — nav with Ctrl-j/Ctrl-k, Ctrl-d kills
# ──────────────────────────────────────────────
# -d "#{HOME}" forces popup cwd = $HOME to avoid the channel/dir-name collision (see prefix+s note below).
bind w display-popup -E -d "#{HOME}" -w 70% -h 60% "tv tmux-windows"

# ──────────────────────────────────────────────
# Init TPM — keep this as the LAST line
# ──────────────────────────────────────────────
# ── sesh via television (prefix + s) ──────────────────────────────────────
# Opens the `sesh` tv channel in a popup: fuzzy-find across tmux sessions,
# zoxide dirs, sesh configs, and a shallow ~ scan. Enter connects · Ctrl-s
# cycles the source · Ctrl-d kills a session. Deps: tv, sesh, fd.
set -g detach-on-destroy off
# NOTE: -d "#{HOME}" forces popup cwd = $HOME. Otherwise, from ~/dotfiles, tv's
# `tv [CHANNEL] [PATH]` grammar parses the bareword `sesh` as a PATH (the
# ~/dotfiles/sesh stow dir exists), falls back to default_channel=files, and errors.
bind-key "s" display-popup -E -d "#{HOME}" -w 80% -h 70% "tv sesh"   # prefix + s → sesh picker (sessions first)
bind-key "S" run-shell "sesh last"                      # prefix + S → jump to the last-used session

run '~/.tmux/plugins/tpm/tpm'