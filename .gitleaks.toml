# .gitleaks.toml — extend gitleaks' built-in rules with Anthropic/Claude key detection.
# Auto-loaded from the repo root by `gitleaks protect --staged` (the .githooks/pre-commit gate)
# and by `gitleaks detect`. Default gitleaks does NOT catch sk-ant-sid (Claude session)
# or sk-ant-api (Anthropic API) tokens — this rule closes that gap.
[extend]
useDefault = true

[[rules]]
id = "anthropic-claude-key"
description = "Anthropic API key or Claude session key (sk-ant-api / sk-ant-sid)"
regex = '''sk-ant-(?:api|sid)[0-9]{2}-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]
